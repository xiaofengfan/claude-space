<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claude Space</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 40%, #16213e 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }

  /* 背景光晕 */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
  }
  .glow-1 {
    width: 260px; height: 260px;
    background: #7c3aed;
    top: -80px; left: -60px;
  }
  .glow-2 {
    width: 200px; height: 200px;
    background: #3b82f6;
    bottom: -60px; right: -40px;
  }

  /* Logo 区域 */
  .logo-container {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
  }

  .logo-icon {
    width: 72px; height: 72px;
    border-radius: 18px;
    background: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(124, 58, 237, 0.35);
  }

  .logo-icon svg {
    width: 42px; height: 42px;
  }

  .product-name {
    font-size: 28px; font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #e0e7ff 0%, #a5b4fc 50%, #93c5fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .product-subtitle {
    font-size: 13px; color: rgba(148, 163, 184, 0.7);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* 加载指示器 */
  .loading-bar {
    position: relative; z-index: 1;
    margin-top: 36px;
    width: 180px; height: 3px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    overflow: hidden;
  }

  .loading-bar-fill {
    height: 100%; width: 40%;
    background: linear-gradient(90deg, #7c3aed, #3b82f6);
    border-radius: 2px;
    animation: slide 1.4s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  .version {
    position: absolute; bottom: 16px;
    font-size: 11px; color: rgba(148, 163, 184, 0.35);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="logo-container">
  <div class="logo-icon">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 6L6 16v16l18 10 18-10V16L24 6z" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <path d="M24 18l-8 5v9l8 5 8-5v-9l-8-5z" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="3" fill="rgba(255,255,255,0.65)"/>
      <line x1="24" y1="21" x2="24" y2="10" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="24" y1="27" x2="24" y2="38" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="21" y1="24" x2="10" y2="24" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="27" y1="24" x2="38" y2="24" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    </svg>
  </div>
  <span class="product-name">Claude Space</span>
  <span class="product-subtitle">AI 驱动的开发工作台</span>
</div>

<div class="loading-bar">
  <div class="loading-bar-fill"></div>
</div>

<span class="version">v1.1.6</span>

</body>
</html>
